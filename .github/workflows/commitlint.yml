## commit-guard caller workflow
## install: copy this to .github/workflows/commitlint.yml
## docs: https://github.com/codywilliamson/commit-guard

name: Commitlint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
    inputs:
      from:
        description: Starting commit SHA
        required: true
        type: string
      to:
        description: Ending commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  commitlint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: codywilliamson/commit-guard@v0.3.1
        with:
          mode: commits
          token: ${{ github.token }}
          from: ${{ inputs.from }}
          to: ${{ inputs.to }}
